<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Project Planner - Merged View</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; line-height: 1.6; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 3px solid #0070f3; padding-bottom: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #34495e; }
        textarea, input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #d1d8e0; border-radius: 6px; box-sizing: border-box; }
        button { background: #0070f3; color: white; border: none; padding: 15px 30px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #a5b1c2; }
        
        /* Merged Section Styling */
        .person-block { margin-top: 35px; border: 1px solid #e1e8ed; border-radius: 8px; overflow: hidden; background: #fff; }
        .person-header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .total-badge { background: #27ae60; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
        
        .task-card { padding: 15px 20px; border-bottom: 1px solid #f1f2f6; transition: background 0.2s; }
        .task-card:last-child { border-bottom: none; }
        .task-card:hover { background: #f9fbff; }
        .task-title { color: #0070f3; font-weight: bold; display: block; margin-bottom: 5px; }
        .task-rationale { font-size: 0.9em; color: #57606f; margin: 5px 0; }
        .task-hours { font-size: 0.85em; font-weight: bold; color: #2f3542; background: #dfe4ea; padding: 2px 8px; border-radius: 4px; display: inline-block; }
        
        #loading { text-align: center; margin: 20px 0; color: #0070f3; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AI Agent Project Planner</h1>
        
        <label>Project Name</label>
        <input type="text" id="projName" placeholder="e.g. E-Commerce MVP">

        <label>Industry</label>
        <input type="text" id="industry" placeholder="e.g. Retail Tech">

        <label>Requirements</label>
        <textarea id="requirements" rows="3" placeholder="Core features..."></textarea>
        
        <label>Team Members (Name | Skills)</label>
        <textarea id="team" rows="4">Alice | Frontend, UI/UX
Bob | Backend, Database, Security
Charlie | QA, DevOps
Diana | Planning, Docs</textarea>

        <button id="runBtn" onclick="generatePlan()">Generate & Merge Workloads</button>

        <div id="loading" style="display:none;">⏳ Calculating total workloads...</div>
        <div id="output"></div>
    </div>

    <script>
        async function generatePlan() {
            const btn = document.getElementById('runBtn');
            const output = document.getElementById('output');
            const loading = document.getElementById('loading');
            
            const teamLines = document.getElementById('team').value.trim().split('\n');
            const team_members = teamLines.map(line => {
                const [name, skills] = line.split('|');
                return { name: name?.trim() || 'User', skills: skills?.trim() || 'General' };
            });

            const data = {
                project_name: document.getElementById('projName').value,
                industry: document.getElementById('industry').value,
                requirements: document.getElementById('requirements').value,
                team_members: team_members
            };

            btn.disabled = true;
            loading.style.display = 'block';
            output.innerHTML = '';

            try {
                const response = await fetch('/api/generate-plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    let htmlContent = `<h2 style="margin-top:30px;">Summary for ${result.project}</h2>`;
                    
                    // 1. GROUP AND SUM LOGIC
                    const grouped = {};
                    result.plan.forEach(task => {
                        const person = task.assigned_to || 'Unassigned';
                        if (!grouped[person]) {
                            grouped[person] = { tasks: [], sum: 0 };
                        }
                        grouped[person].tasks.push(task);
                        // Convert hours to number and add to total
                        const hours = parseInt(task.estimated_hours) || 0;
                        grouped[person].sum += hours;
                    });

                    // 2. DISPLAY LOGIC
                    for (const person in grouped) {
                        htmlContent += `
                            <div class="person-block">
                                <div class="person-header">
                                    <span>👤 <strong>${person}</strong></span>
                                    <span class="total-badge">Total Workload: ${grouped[person].sum} hrs</span>
                                </div>`;
                        
                        grouped[person].tasks.forEach(task => {
                            htmlContent += `
                                <div class="task-card">
                                    <span class="task-title">✅ ${task.task_name}</span>
                                    <p class="task-rationale">${task.rationale}</p>
                                    <span class="task-hours">⏱️ ${task.estimated_hours} hrs</span>
                                </div>`;
                        });
                        
                        htmlContent += `</div>`;
                    }
                    output.innerHTML = htmlContent;
                } else {
                    output.innerHTML = `<p style="color:red;">Error: ${result.detail}</p>`;
                }
            } catch (err) {
                output.innerHTML = `<p style="color:red;">Network Error: ${err.message}</p>`;
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
                output.style.display = 'block';
            }
        }
    </script>
</body>
</html>
